name: Run LinkedIn Outreach Pipeline

# This tells GitHub to display the "Run workflow" button!
on:
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @playwright/test google-spreadsheet google-auth-library typescript @types/node

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Execute Cloud Automation
        run: npx playwright test
        env:
          # Pulls your secure keys from GitHub Secrets so they aren't public
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
